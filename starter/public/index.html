<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My product</title>
  <style>
    /* ds-allow-hardcode:start  Starter page the buyer owns. Their project has no design system; Day 3 restyles it. */
    :root { --ink: #16161a; --muted: #5c5c66; --line: #d9d9de; --bg: #fafaf7; --accent: #1f5eff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 12px; }
    .lead { color: var(--muted); margin: 0 0 48px; }
    form { display: grid; gap: 12px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    label { font-weight: 600; font-size: 15px; }
    textarea, input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
    textarea { min-height: 96px; resize: vertical; }
    button { justify-self: start; font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #result { margin-top: 16px; padding: 16px; border-radius: 8px; background: #f0f0f3; white-space: pre-wrap; }
    #result:empty { display: none; }
    footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
    /* ds-allow-hardcode:end */
  </style>
</head>
<body>
  <main>
    <h1 id="title">My product</h1>
    <p class="lead">Hired on day one. It gets its real job on Wednesday.</p>

    <form id="run">
      <label for="input">Say something to it</label>
      <textarea id="input" required>Hello, it's your first day.</textarea>
      <label for="code">Access code</label>
      <input id="code" type="password" autocomplete="off" required>
      <button type="submit">Run</button>
      <div id="result" role="status" aria-live="polite"></div>
    </form>

    <footer>Built with the AI-Proof harness.</footer>
  </main>

  <script>
    fetch("/info").then(r => r.json()).then(info => {
      if (!info.owner) return;
      const title = info.owner + "'s product";
      document.getElementById("title").textContent = title;
      document.title = title;
    }).catch(() => {});

    const form = document.getElementById("run");
    const result = document.getElementById("result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      result.textContent = "Working...";
      try {
        const res = await fetch("/run", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            input: document.getElementById("input").value,
            code: document.getElementById("code").value,
          }),
        });
        const data = await res.json();
        result.textContent = data.output || data.error || "No answer.";
      } catch {
        result.textContent = "Couldn't reach your product. Try again.";
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
